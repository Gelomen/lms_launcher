appId: com.lms.launcher
productName: lms_launcher
directories:
  output: dist-release
files:
  - dist/**
  - dist-main/**
  - package.json
  # 明确排除 test 产物（防 dist-main 残留被打包）
  - "!dist-main/*.test.js"
  - "!dist-main/test-utils.js"
asar: true
electronDist: node_modules/electron/dist
# 更新脚本随包分发：win-unpacked/lms-launcher-update.ps1（portable 解压后与主 exe 同目录）
extraFiles:
  - from: scripts/lms-launcher-update.ps1
    to: lms-launcher-update.ps1
  - from: src-main/gpu-counters.ps1
    to: gpu-counters.ps1
  # 参数表随包分发（2026-10-06）：configs/llama_params.yaml 是唯一真相源，
  # 用户解压覆盖即完成参数表升级；另两份 yaml 是用户数据，不进包。
  - from: configs/llama_params.yaml
    to: configs/llama_params.yaml
extraResources:
  - from: src-main/icon.ico
    to: icon.ico
win:
  target: portable
  icon: src-main/icon.ico
portable:
  artifactName: "lms-launcher-${version}-portable.exe"
